<!DOCTYPE html>
<html>
<head>
  <title>School Club Website</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body {
      background-color: #f9f9f9;
      font-family: Arial, sans-serif;
      padding: 30px 15px;
    }
    h1 {
      text-align: center;
      color: #d671f0;
    }
    .club-card {
      text-align: center;
      border: 2px solid #eca4ec;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background-color: #fff8e1;
    }
    .club-card h3 {
      color: #f363c3;
    }
  </style>
</head>
<body>

  <h1>My School Clubs</h1>

 
  <div class="container">

    
    <div class="row">

     
      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>English Club</h3>
          <p>My school enaugrates interesting english activities that the whole school can participate and take interests to learn English .</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Science Club</h3>
          <p>We learn different types of chemicals and experiments.</p>
        </div>
      </div>

      <div class="col-12 col-md-12 col-lg-4">
        <div class="club-card">
          <h3>Sketching Club</h3>
          <p>They teach us the basics of Sketching and Art.</p>
        </div>
      </div>

    </div>
  </div>

  
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
  </script>

</body>
</html>
